# kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: controller-bydi-cd
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    extraMounts:
      - hostPath: /tmp/kind-node1-logs
        containerPath: /mnt/disks/logs/pv
      - hostPath: /tmp/mkcert
        containerPath: /mkcerts
  - role: worker
    image: kindest/node:v1.31.0
    extraMounts:
      - hostPath: /tmp/kind-node2-logs
        containerPath: /mnt/disks/logs/pv
      - hostPath: /tmp/mkcert
        containerPath: /mkcerts