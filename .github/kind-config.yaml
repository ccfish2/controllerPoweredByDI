# kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nwp-verify
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0
    extraMounts:
      - hostPath: /tmp/kind-node1-logs
        containerPath: /mnt/disks/logs/pv
  - role: worker
    image: kindest/node:v1.30.0
    extraMounts:
      - hostPath: /tmp/kind-node2-logs
        containerPath: /mnt/disks/logs/pv
