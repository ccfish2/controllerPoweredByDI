name: Image CI Builder
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - development

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

jobs:
  test:
    name: Controller tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read          # no write token, no secrets in this job
    steps:
      - name: Checkout code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install envtest binaries (etcd, kube-apiserver)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25
          ASSETS="$(setup-envtest use 1.37.x -p path)"
          test -x "$ASSETS/kube-apiserver" && test -x "$ASSETS/etcd"
          echo "KUBEBUILDER_ASSETS=$ASSETS" >> "$GITHUB_ENV"

      - name: Run controller tests
        run: go test ./pkg/gateway_api/... -count=1 -v

  build-and-push-prs:
    timeout-minutes: 45
    name: Build and Push Images
    runs-on: ubuntu-22.04
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (for caching)
        uses: docker/setup-buildx-action@v3

      - name: Checkout main code (trusted)
        uses: actions/checkout@v3
        with: 
          ref: main

      - name: Force sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Docker Buildx (for caching)
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker layer caching
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERPASSWD }}

      - name: Getting image tag
        id: tag
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${PR_HEAD_SHA}" ]; then
            echo "tag=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${EVENT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # Hand the tag to the downstream "Deploy Image into Kind Cluster"
      # workflow. workflow_run cannot read job outputs of the triggering
      # run, so the tag travels as a tiny artifact.
      # ------------------------------------------------------------
      - name: Save image tag
        run: echo "${{ steps.tag.outputs.tag }}" > image_tag.txt

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt
          retention-days: 7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y make

      - name: Build Docker image using Makefile
        env:
          DOCKER_BUILDKIT: 1
        run: |
          make docker-operator-image-generic IMAGE_TAG=${{ steps.tag.outputs.tag }} NOCACHE=1

      - name: Save Docker Image as Tar
        run: |
          docker pull docker.io/jimin1/dolphin-operator-generic:${{ steps.tag.outputs.tag }}
          docker save -o dolphin-operator-generic.tar docker.io/jimin1/dolphin-operator-generic:${{ steps.tag.outputs.tag }}

      - name: Upload Docker Tar as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-operator-image
          path: dolphin-operator-generic.tar

      - name: Create Release and Upload Docker Image Tar
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v4.1
          files: dolphin-operator-generic.tar  # Path to the file to upload
          body: |
            http ingress tests are included
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-digests:
    if: ${{ always() }}
    name: Display Digests
    runs-on: ubuntu-22.04
    needs: build-and-push-prs

    steps:
      - name: Download Dolphin Operator Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-operator-image
          path: image-digest/

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          find -type f | sort | xargs -d '\n' cat