name: Deploy Image into Kind Cluster

on:
  workflow_run:
    workflows: ["Image CI Builder"]
    types:
      - completed

jobs:
  deploy-to-kind:
    name: Deploy to Kind Cluster
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: kind

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # - name: Download Dolphin Operator Image from GitHub Release
      #   run: |
      #     curl -LJO https://github.com/ccfish2/controllerPoweredByDI/releases/download/civ1/dolphin-operator-generic.tar

      # - name: Load Docker Image into KinD
      #   run: |
      #     kind load image-archive ./dolphin-operator-generic.tar

      - name: Deploy using install/manifests (override image)
        run: |
          echo "Deploying image: jimin1/dolphin-operator-generic:${{ needs.build-and-push-prs.outputs.image_tag }}"
          kubectl create namespace dolphin || true
          for file in install/*.yaml; do
            sed "s|image: .*|image: jimin1/dolphin-operator-generic:${{ github.event.workflow_run.head_sha }}|g" "$file" | kubectl apply -n dolphin -f -
          done

      - name: Wait for Deployment to be Ready
        run: |
          kubectl rollout status deployment/dolphin-operator -n dolphin --timeout=120s

      - name: Run Operator Tests
        run: |
          bash actions/tests/operator-tests.sh

      - name: Run Unit Tests
        run: |
          bash actions/tests/unit-tests.sh

      - name: Delete KinD cluster
        if: always()
        run: kind delete cluster

