name: Deploy Image into Kind Cluster

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed

jobs:
  deploy-to-kind:
    name: Deploy to Kind Cluster
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v1

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Create Kind Cluster
        uses: ./.github/actions/tools/setup-kind-cluster.yaml

      - name: Load Docker Image into Kind
        run: |
          kind load docker-image quay.io/${{ secrets.QUAY_USERNAME }}/dolphin-operator:${{ github.sha }}

      - name: Apply Kubernetes Deployment
        run: |
          kubectl create namespace dolphin || true
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: dolphin-operator
            namespace: dolphin
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: dolphin-operator
            template:
              metadata:
                labels:
                  app: dolphin-operator
              spec:
                containers:
                - name: dolphin-operator
                  image: quay.io/${{ secrets.QUAY_USERNAME }}/dolphin-operator:${{ github.sha }}
                  ports:
                  - containerPort: 8080
          EOF

      - name: Verify Deployment
        run: kubectl get deployments -n dolphin
