apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: dolphin-gateway-gateway-mixed
  namespace: dolphin
spec:
  backendServices:
  - name: tcp-backend
    namespace: dolphin
    number:
    - "3000"
  resources:
  - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    edsClusterConfig:
      serviceName: dolphin/infra-backend-v1:8080
    name: dolphin:infra-backend-v1:8080
    outlierDetection:
      splitExternalLocalOriginErrors: true
    type: EDS
    typedExtensionProtocolOptions:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        commonHttpProtocolOptions:
          idleTimeout: 60s
        useDownstreamProtocolConfig:
          http2ProtocolOptions: {}
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: tcp-listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 3000
    filter_chains:
      - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: tcp
              cluster: dolphin/tcp-backend:3000
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: dolphin/tcp-backend:3000
    type: EDS
    eds_cluster_config:
      service_name: dolphin/tcp-backend:3000
  services:
  - name: dolphin-gateway-gateway-mixed
    namespace: dolphin
    ports:
    - 3000