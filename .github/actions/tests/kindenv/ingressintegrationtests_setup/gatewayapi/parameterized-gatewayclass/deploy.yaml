---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nodeport-gateway-class
  namespace: dolphin
spec:
  controllerName: io.dolphin/gateway-controller
  description: The default Dolphin GatewayClass
  parametersRef:
    group: dolphin.io
    kind: DolphinGatewayClassConfig
    name: nodeport-gateway-config
    namespace: dolphin
---
apiVersion: dolphin.io/v2alpha1
kind: DolphinGatewayClassConfig
metadata:
  name: nodeport-gateway-config
  namespace: dolphin
spec:
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nodeport-gateway
  namespace: dolphin
spec:
  gatewayClassName: nodeport-gateway-class
  listeners:
  - protocol: HTTP
    port: 80
    name: web-gw
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-app-1
  namespace: dolphin
spec:
  parentRefs:
  - name: nodeport-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /details
    backendRefs:
    - name: details
      port: 9080