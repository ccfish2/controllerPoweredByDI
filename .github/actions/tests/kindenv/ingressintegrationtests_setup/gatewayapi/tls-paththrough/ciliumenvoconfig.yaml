apiVersion: v1
items:
- apiVersion: cilium.io/v2
  kind: CiliumEnvoyConfig
  metadata:
    annotations:
      cec.cilium.io/use-original-source-address: "false"
    labels:
      gateway.networking.k8s.io/gateway-name: tls-passthrough-gateway
    name: dolphin-gateway-tls-passthrough-gateway
    namespace: dolphin
    ownerReferences:
    - apiVersion: gateway.networking.k8s.io/v1
      controller: true
      kind: Gateway
      name: tls-passthrough-gateway
  spec:
    backendServices:
    - name: tls-passthrough-backend
      namespace: dolphin
      number:
      - "443"
    resources:
    - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
      filterChains:
      - filterChainMatch:
          transportProtocol: raw_buffer
        filters:
        - name: envoy.filters.network.http_connection_manager
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            commonHttpProtocolOptions:
              maxStreamDuration: 0s
            httpFilters:
            - name: envoy.filters.http.grpc_web
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
            - name: envoy.filters.http.grpc_stats
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_stats.v3.FilterConfig
                emitFilterState: true
                enableUpstreamStats: true
            - name: envoy.filters.http.router
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            internalAddressConfig:
              cidrRanges:
              - addressPrefix: 10.0.0.0
                prefixLen: 8
              - addressPrefix: 172.16.0.0
                prefixLen: 12
              - addressPrefix: 192.168.0.0
                prefixLen: 16
              - addressPrefix: 127.0.0.1
                prefixLen: 32
            rds:
              routeConfigName: listener-insecure
            statPrefix: listener-insecure
            streamIdleTimeout: 300s
            upgradeConfigs:
            - upgradeType: websocket
            useRemoteAddress: true
      - filterChainMatch:
          serverNames:
          - passthrough.bookinfo.cilium.rocks
          transportProtocol: tls
        filters:
        - name: envoy.filters.network.tcp_proxy
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
            cluster: dolphin:tls-passthrough-backend:443
            statPrefix: dolphin:tls-passthrough-backend:443
      listenerFilters:
      - name: envoy.filters.listener.tls_inspector
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      name: listener
      socketOptions:
      - description: Enable TCP keep-alive (default to enabled)
        intValue: "1"
        level: "1"
        name: "9"
      - description: TCP keep-alive idle time (in seconds) (defaults to 10s)
        intValue: "10"
        level: "6"
        name: "4"
      - description: TCP keep-alive probe intervals (in seconds) (defaults to 5s)
        intValue: "5"
        level: "6"
        name: "5"
      - description: TCP keep-alive probe max failures.
        intValue: "10"
        level: "6"
        name: "6"
    - '@type': type.googleapis.com/envoy.config.route.v3.RouteConfiguration
      name: listener-insecure
    - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
      edsClusterConfig:
        serviceName: dolphin/tls-passthrough-backend:443
      name: dolphin:tls-passthrough-backend:443
      outlierDetection:
        splitExternalLocalOriginErrors: true
      type: EDS
    services:
    - name: dolphin-gateway-tls-passthrough-gateway
      namespace: dolphin
      ports:
      - 443
kind: List
metadata:
  resourceVersion: ""
