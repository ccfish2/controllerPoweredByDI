apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumenvoyconfigs.cilium.io
spec:
  conversion:
    strategy: None
  group: cilium.io
  names:
    categories:
    - cilium
    kind: CiliumEnvoyConfig
    listKind: CiliumEnvoyConfigList
    plural: ciliumenvoyconfigs
    shortNames:
    - cec
    singular: ciliumenvoyconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The age of the identity
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v2
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              backendServices:
                description: BackendServices specifies Kubernetes services whose backends
                  are automatically synced to Envoy using EDS.  Traffic for these
                  services is not forwarded to an Envoy listener. This allows an Envoy
                  listener load balance traffic to these backends while normal Cilium
                  service load balancing takes care of balancing traffic for these
                  services at the same time.
                items:
                  properties:
                    name:
                      description: Name is the name of a destination Kubernetes service
                        that identifies traffic to be redirected.
                      type: string
                    namespace:
                      description: Namespace is the Kubernetes service namespace.
                        In CiliumEnvoyConfig namespace defaults to the namespace of
                        the CEC, In CiliumClusterwideEnvoyConfig namespace defaults
                        to "default".
                      type: string
                    number:
                      description: Ports is a set of port numbers, which can be used
                        for filtering in case of underlying is exposing multiple port
                        numbers.
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
              nodeSelector:
                description: NodeSelector is a label selector that determines to which
                  nodes this configuration applies. If nil, then this config applies
                  to all nodes.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: A label selector requirement is a selector that
                        contains values, a key, and an operator that relates the key
                        and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: operator represents a key's relationship to
                            a set of values. Valid operators are In, NotIn, Exists
                            and DoesNotExist.
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          type: string
                        values:
                          description: values is an array of string values. If the
                            operator is In or NotIn, the values array must be non-empty.
                            If the operator is Exists or DoesNotExist, the values
                            array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      description: MatchLabelsValue represents the value from the
                        MatchLabels {key,value} pair.
                      maxLength: 63
                      pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                      type: string
                    description: matchLabels is a map of {key,value} pairs. A single
                      {key,value} in the matchLabels map is equivalent to an element
                      of matchExpressions, whose key field is "key", the operator
                      is "In", and the values array contains only "value". The requirements
                      are ANDed.
                    type: object
                type: object
              resources:
                description: 'Envoy xDS resources, a list of the following Envoy resource
                  types: type.googleapis.com/envoy.config.listener.v3.Listener, type.googleapis.com/envoy.config.route.v3.RouteConfiguration,
                  type.googleapis.com/envoy.config.cluster.v3.Cluster, type.googleapis.com/envoy.config.endpoint.v3.ClusterLoadAssignment,
                  and type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret.'
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              services:
                description: Services specifies Kubernetes services for which traffic
                  is forwarded to an Envoy listener for L7 load balancing. Backends
                  of these services are automatically synced to Envoy usign EDS.
                items:
                  properties:
                    listener:
                      description: "Listener specifies the name of the Envoy listener
                        the service traffic is redirected to. The listener must be
                        specified in the Envoy 'resources' of the same CiliumEnvoyConfig.
                        \n If omitted, the first listener specified in 'resources'
                        is used."
                      type: string
                    name:
                      description: Name is the name of a destination Kubernetes service
                        that identifies traffic to be redirected.
                      type: string
                    namespace:
                      description: Namespace is the Kubernetes service namespace.
                        In CiliumEnvoyConfig namespace this is overridden to the namespace
                        of the CEC, In CiliumClusterwideEnvoyConfig namespace defaults
                        to "default".
                      type: string
                    ports:
                      description: Ports is a set of service's frontend ports that
                        should be redirected to the Envoy listener. By default all
                        frontend ports of the service are redirected.
                      items:
                        type: integer
                      type: array
                  required:
                  - name
                  type: object
                type: array
            type: object
        required:
        - metadata
        type: object
    served: true
    storage: true
    subresources: {}
--- 
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumexternalworkloads.cilium.io
spec:
  conversion:
    strategy: None
  group: cilium.io
  names:
    categories:
    - cilium
    kind: CiliumExternalWorkload
    listKind: CiliumExternalWorkloadList
    plural: ciliumexternalworkloads
    shortNames:
    - cew
    singular: ciliumexternalworkload
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.id
      name: Cilium ID
      type: integer
    - jsonPath: .status.ip
      name: IP
      type: string
    name: v2
    schema:
      openAPIV3Schema:
        description: CiliumExternalWorkload is a Kubernetes Custom Resource that contains
          a specification for an external workload that can join the cluster.  The
          name of the CRD is the FQDN of the external workload, and it needs to match
          the name in the workload registration. The labels on the CRD object are
          the labels that will be used to allocate a Cilium Identity for the external
          workload. If 'io.kubernetes.pod.namespace' or 'io.kubernetes.pod.name' labels
          are not explicitly specified, they will be defaulted to 'default' and <workload
          name>, respectively. 'io.cilium.k8s.policy.cluster' will always be defined
          as the name of the current cluster, which defaults to "default".
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired configuration of the external Cilium
              workload.
            properties:
              ipv4-alloc-cidr:
                description: IPv4AllocCIDR is the range of IPv4 addresses in the CIDR
                  format that the external workload can use to allocate IP addresses
                  for the tunnel device and the health endpoint.
                pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\/([0-9]|[1-2][0-9]|3[0-2])$
                type: string
              ipv6-alloc-cidr:
                description: IPv6AllocCIDR is the range of IPv6 addresses in the CIDR
                  format that the external workload can use to allocate IP addresses
                  for the tunnel device and the health endpoint.
                pattern: ^s*((([0-9A-Fa-f]{1,4}:){7}(:|([0-9A-Fa-f]{1,4})))|(([0-9A-Fa-f]{1,4}:){6}:([0-9A-Fa-f]{1,4})?)|(([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){0,1}):([0-9A-Fa-f]{1,4})?))|(([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){0,2}):([0-9A-Fa-f]{1,4})?))|(([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){0,3}):([0-9A-Fa-f]{1,4})?))|(([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){0,4}):([0-9A-Fa-f]{1,4})?))|(([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){0,5}):([0-9A-Fa-f]{1,4})?))|(:(:|((:[0-9A-Fa-f]{1,4}){1,7}))))(%.+)?s*/([0-9]|[1-9][0-9]|1[0-1][0-9]|12[0-8])$
                type: string
            type: object
          status:
            description: Status is the most recent status of the external Cilium workload.
              It is a read-only field.
            properties:
              id:
                description: ID is the numeric identity allocated for the external
                  workload.
                format: int64
                type: integer
              ip:
                description: IP is the IP address of the workload. Empty if the workload
                  has not registered.
                type: string
            type: object
        required:
        - metadata
        type: object
    served: true
    storage: true
    subresources:
      status: {}
