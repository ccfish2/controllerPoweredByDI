# TLS ingress example, requires the below two applications
# https://raw.githubusercontent.com/istio/istio/release-1.11/samples/bookinfo/platform/kube/bookinfo.yaml
# https://github.com/GoogleCloudPlatform/microservices-demo
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tls-ingress
  namespace: dolphin
spec:
  ingressClassName: dolphin
  rules:
  - host: bookinfo.cilium.rocks
    http:
      paths:
      - backend:
          service:
            name: details
            port:
              number: 9080
        path: /details
        pathType: Prefix
      - backend:
          service:
            name: productpage
            port:
              number: 9080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - bookinfo.cilium.rocks
    secretName: tls-ingress-secret
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dolphin-ingress-tls-ingress
  namespace: dolphin
subsets:
- addresses:
  - ip: 192.192.192.192
  ports:
  - port: 9999
    protocol: TCP
