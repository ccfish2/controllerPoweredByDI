apiVersion: v1
kind: Service
metadata:
  name: dolphin-ingress
  namespace: dolphin
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    nodePort: 31605
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    nodePort: 30965
    port: 443
    protocol: TCP
    targetPort: 443
  sessionAffinity: None
  type: LoadBalancer
--- 
apiVersion: v1
kind: Endpoints
metadata:
  name: dolphin-ingress
  namespace: dolphin
subsets:
- addresses:
  - ip: 192.192.192.192
  ports:
  - port: 9999
    protocol: TCP