apiVersion: v1
kind: Service
metadata:
  name: dolphin-ingress
  namespace: kube-system
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    nodePort: 31605
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    nodePort: 30965
    port: 443
    protocol: TCP
    targetPort: 443
  sessionAffinity: None
  type: LoadBalancer
