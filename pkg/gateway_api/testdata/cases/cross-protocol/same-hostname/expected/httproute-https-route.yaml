apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-route
  namespace: gateway-conformance-infra
spec:
  hostnames:
  - api.example.test
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cross-protocol-same-hostname
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: infra-backend-v1
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /secure
status:
  parents:
  - conditions:
    - message: Accepted HTTPRoute
      reason: Accepted
      status: "True"
      type: Accepted
    - message: Service reference is valid
      reason: ResolvedRefs
      status: "True"
      type: ResolvedRefs
    controllerName: io.dolphin/gateway-controller
    parentRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: cross-protocol-same-hostname
      sectionName: https
